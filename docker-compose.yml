name: groupproof-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groupproof}
      POSTGRES_USER: ${POSTGRES_USER:-groupproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groupproof-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groupproof} -d ${POSTGRES_DB:-groupproof}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-groupproof}:${POSTGRES_PASSWORD:-groupproof-local}@postgres:5432/${POSTGRES_DB:-groupproof}
      DATABASE_TIMEZONE: ${DATABASE_TIMEZONE:-Asia/Shanghai}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      APP_MODE: ${APP_MODE:-dev}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      # Local Docker may reuse the same mail provider as Railway. Secrets stay in
      # the ignored .env file and are forwarded only to the API container.
      MAIL_MODE: ${MAIL_MODE:-capture}
      MAIL_PUBLIC_ENABLED: ${MAIL_PUBLIC_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      # 本地默认用 AI 固定假结果；文件存储填了 Supabase 变量才启用
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./services/worker
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; raise SystemExit(0 if os.path.exists('/app/app/__main__.py') else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3

  risk-scheduler:
    build:
      context: ./services/api
    command: ["python", "-m", "scripts.daily_risks", "--loop"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-groupproof}:${POSTGRES_PASSWORD:-groupproof-local}@postgres:5432/${POSTGRES_DB:-groupproof}
      DATABASE_TIMEZONE: ${DATABASE_TIMEZONE:-Asia/Shanghai}
    depends_on:
      api:
        condition: service_healthy

  report-worker:
    build:
      context: ./services/api
    command: ["celery", "-A", "app.modules.d.report_tasks:celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-groupproof}:${POSTGRES_PASSWORD:-groupproof-local}@postgres:5432/${POSTGRES_DB:-groupproof}
      DATABASE_TIMEZONE: ${DATABASE_TIMEZONE:-Asia/Shanghai}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建期 rewrites 兑底地址（容器网络内固定为服务名）；运行时代理另读 API_INTERNAL_URL
        API_INTERNAL_URL: ${API_DOCKER_INTERNAL_URL:-http://api:8000}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
        NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-real}
        NEXT_PUBLIC_ENABLE_MOCKS: ${NEXT_PUBLIC_ENABLE_MOCKS:-false}
        NEXT_PUBLIC_API_FEATURES: ${NEXT_PUBLIC_API_FEATURES:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    environment:
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
      NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-real}
      NEXT_PUBLIC_ENABLE_MOCKS: ${NEXT_PUBLIC_ENABLE_MOCKS:-false}
      NEXT_PUBLIC_API_FEATURES: ${NEXT_PUBLIC_API_FEATURES:-}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
